# Andromeda local policy gateway example config.
# Copy to config.yaml and adjust for your host.

host: "127.0.0.1"
port: 8000
ollama_base_url: "http://127.0.0.1:11434"
default_model: "llama3.2:3b"
request_timeout_seconds: 120
sqlite_path: "andromeda-events.db"
# Keep false unless you intentionally allow non-local binds.
allow_non_loopback_bind: false
